name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # Fail fast with a readable message instead of a cryptic Gradle signing error.
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.EXPO_PUBLIC_POWERSYNC_URL }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_POWERSYNC_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit $missing

      # EXPO_PUBLIC_* values are inlined into the JS bundle at build time, so they must exist before Gradle runs.
      - name: Write .env
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.EXPO_PUBLIC_POWERSYNC_URL }}
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            echo "EXPO_PUBLIC_POWERSYNC_URL=$EXPO_PUBLIC_POWERSYNC_URL"
          } > .env

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Check keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: keytool -list -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install

      # A tag like v1.2.3 becomes versionName 1.2.3; the run number keeps versionCode increasing so installs upgrade in place.
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${name}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Gradle output may be signed with the wrong key (Expo's template can fall back to the debug key),
      # so the APK is re-signed explicitly below.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align, sign, verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          OUT=android/app/build/outputs/apk/release
          ls -la "$OUT"
          SRC=$(ls "$OUT"/*.apk | head -1)
          label="${GITHUB_REF_NAME//\//-}"
          FINAL="FarmAssist-${label}.apk"

          "$BT/zipalign" -P 16 -f 4 "$SRC" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$FINAL" aligned.apk

          "$BT/zipalign" -c -P 16 4 "$FINAL"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL"
          ls -la "$FINAL"

      - name: Inspect APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging FarmAssist-*.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true

      - name: Checksum
        run: sha256sum FarmAssist-*.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: FarmAssist-apk
          path: |
            FarmAssist-*.apk
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FarmAssist-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
